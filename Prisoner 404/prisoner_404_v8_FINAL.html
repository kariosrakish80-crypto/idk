<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');
:root{--cyan:#55f3ff;--blue:#4c8cff;--red:#ff526f;--gold:#ffd36a;--ink:#070b16;--panel:rgba(8,15,31,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#050812;color:#eaf8ff;font-family:Rajdhani,Arial,sans-serif;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#070b16}

.topbar{position:absolute;left:max(20px,env(safe-area-inset-left));right:92px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{font:800 22px 'Barlow Condensed',sans-serif;letter-spacing:3px;color:#e9fbff;text-shadow:0 0 16px #4deaff88}.brand small{display:block;font:600 10px Rajdhani;letter-spacing:4px;color:var(--cyan);margin-top:-2px}
.stats{display:flex;gap:8px;align-items:center}.chip{background:rgba(4,12,26,.7);border:1px solid #6eeeff35;padding:7px 12px;min-width:70px;text-align:center;backdrop-filter:blur(8px);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.chip b{display:block;font:700 15px 'Barlow Condensed';color:var(--cyan)}.chip span{font-size:9px;letter-spacing:2px;color:#9eb6ca}
.bars{position:absolute;left:max(20px,env(safe-area-inset-left));top:77px;width:min(310px,42vw)}.barlabel{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:#c4d9e7;margin:5px 0 3px}.track{height:8px;background:#172337;border:1px solid #52657a55;overflow:hidden}.fill{height:100%;transition:width .15s}.health{background:linear-gradient(90deg,#ff456c,#ff9b8b);box-shadow:0 0 12px #ff456c}.energy{background:linear-gradient(90deg,#277cff,#57f5ff);box-shadow:0 0 12px #39dfff}
.stageinfo{position:absolute;right:max(22px,env(safe-area-inset-right));top:85px;text-align:right}.stageinfo strong{display:block;font:800 22px 'Barlow Condensed';letter-spacing:2px;color:#fff}.stageinfo span{font-size:11px;letter-spacing:2px;color:var(--cyan)}

.panel:before{content:"";position:absolute;left:0;top:0;width:80px;height:2px;background:var(--cyan);box-shadow:0 0 15px var(--cyan)}
.eyebrow{font-size:11px;letter-spacing:5px;color:var(--cyan);font-weight:700}

.btnrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
button{font:800 16px Rajdhani;letter-spacing:2px;text-transform:uppercase;color:#06111d;background:linear-gradient(110deg,#61f4ff,#6daaff);border:0;padding:15px 28px;min-height:52px;cursor:pointer;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:transform .15s,filter .15s}
@media(hover:hover){button:hover{transform:translateY(-2px);filter:brightness(1.15)}}
button:active{filter:brightness(1.25)}button.secondary{background:#13263b;color:#b9eaf4;border:1px solid #5beaff66}
.storyline{border-left:2px solid var(--cyan);padding:9px 0 9px 16px;margin:20px 0;color:#d3e7f2;font-size:17px;line-height:1.45}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}.control{background:#0b192b;border:1px solid #4e789355;padding:10px 12px;color:#9fb9cb;font-size:13px}.control b{color:#e7faff}
.upgrades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.upgrade{background:linear-gradient(145deg,#12263d,#0a1527);border:1px solid #59e9ff55;padding:15px 12px;cursor:pointer;min-height:140px;color:#eafaff;text-align:left;clip-path:none;text-transform:none;letter-spacing:0}.upgrade strong{display:block;color:var(--cyan);font:800 18px 'Barlow Condensed';letter-spacing:1px;margin:8px 0}.upgrade span{font-size:13px;line-height:1.3;color:#a8c1d1;font-weight:600}.upgrade:hover{border-color:#fff;box-shadow:0 0 22px #48eaff33}
#touch{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
.pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:max(14px,env(safe-area-inset-left));display:flex;gap:14px;pointer-events:auto}

.touchbtn{width:clamp(78px,15vh,100px);height:clamp(78px,15vh,100px);min-width:78px;min-height:78px;border-radius:24px;clip-path:none;padding:0;background:rgba(14,39,62,.82);border:2px solid #72eaff99;color:#e9fcff;font-size:15px;font-weight:900;letter-spacing:1px;backdrop-filter:blur(8px);box-shadow:0 5px 18px #02081299,0 0 18px #22caff22;touch-action:none;user-select:none;-webkit-user-select:none}
.touchbtn.move{font-size:30px;width:clamp(86px,17vh,112px);height:clamp(86px,17vh,112px)}
.touchbtn.big{width:clamp(96px,19vh,120px);height:clamp(96px,19vh,120px);background:rgba(35,102,139,.9);font-size:16px;border-radius:50%}
.touchbtn.jumpbtn{background:rgba(38,104,143,.9);border-color:#a0f5ff}.touchbtn.voltbtn{border-color:#b78bff;color:#e7d7ff}
.touchbtn.voltbtn.ready{box-shadow:0 0 26px #b78bff,0 5px 18px #02081299;background:rgba(70,40,120,.9)}
.touchbtn:active,.touchbtn.active{background:#1a8caa;color:#fff;transform:scale(.93);filter:none}

#pause{position:fixed;right:max(14px,env(safe-area-inset-right));top:12px;z-index:4;display:none;pointer-events:auto;width:66px;height:50px;padding:0;font-size:18px;letter-spacing:0}
@media(max-width:650px){.topbar{left:10px;right:80px;top:8px;gap:5px}.brand{font-size:16px}.brand small{font-size:7px}.stats{gap:4px;flex-wrap:wrap;justify-content:flex-end}.chip{padding:4px 6px;min-width:48px}.chip b{font-size:12px}.chip span{font-size:7px}.bars{left:10px;top:60px;width:36vw}.barlabel{font-size:9px;margin:3px 0 2px}.track{height:7px}.stageinfo{right:76px;top:62px}.stageinfo strong{font-size:15px}.stageinfo span{font-size:8px}.upgrades{grid-template-columns:1fr}.upgrade{min-height:0}.panel{padding:22px 18px}.sub{font-size:14px}#bossbar{bottom:130px;width:min(480px,50vw)}#pause{right:10px;top:8px;width:60px;height:46px}}
@media(orientation:landscape) and (max-height:500px){.topbar{top:5px}.brand{font-size:15px}.bars{top:48px;width:29vw}.stageinfo{top:60px;right:84px}.stageinfo strong{font-size:14px}.stageinfo span{font-size:7px}#bossbar{bottom:auto;top:96px;width:32vw}.pad,.actions{bottom:max(8px,env(safe-area-inset-bottom))}.touchbtn{width:74px;height:74px;min-width:74px;min-height:74px}.touchbtn.move{width:88px;height:88px}.touchbtn.big{width:92px;height:92px}.pad{gap:10px}.actions{gap:8px}.panel{max-height:96vh;padding:16px 22px}h1{font-size:40px;margin:8px 0}.storyline{margin:10px 0;font-size:14px}.btnrow{margin-top:14px}}
@media(orientation:portrait) and (max-width:900px){body.playing-game #rotateNotice{display:block}}
#dialog{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(780px,94vw);z-index:6;display:none;background:linear-gradient(145deg,rgba(13,27,48,.96),rgba(5,11,23,.97));border:1px solid #66eaff77;padding:14px 20px 12px;cursor:pointer;touch-action:manipulation;box-shadow:0 0 40px #0ba4db33;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
#dlgWho{font:800 15px 'Barlow Condensed';letter-spacing:4px;margin-bottom:6px}
#dlgTxt{font-size:19px;line-height:1.4;color:#e5f6ff;min-height:54px}
#dlgHint{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;color:#7fa0b5;margin-top:8px}
#dlgSkip{min-height:40px;padding:8px 16px;font-size:13px}
.upgrade span{display:block;margin-top:4px}#relicLine{font-size:10px;letter-spacing:1px;color:#ffd36a;margin-top:6px;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hint{position:absolute;top:64px;left:50%;transform:translateX(-50%);max-width:36vw;text-align:center;background:#061323dd;border:1px solid #ffd36a88;color:#ffe9a6;padding:6px 12px;font-size:13px;letter-spacing:1px;font-weight:700;display:none}.control.lock{opacity:.5}@media(max-height:500px){.mobhide{display:none}#hint{top:58px;font-size:12px}}@media(max-width:650px){#hint{max-width:30vw;font-size:11px}}.upgrade:disabled{opacity:.45;cursor:not-allowed}
.pad{transform:scale(var(--bs,1));transform-origin:bottom left}.actions{transform:scale(var(--bs,1));transform-origin:bottom right}
@media(max-height:500px){#dialog{padding:10px 16px 8px;width:min(700px,70vw)}#dlgTxt{font-size:15px;min-height:40px}}
</style>

<body>
<canvas id="game"></canvas><div id="vignette"></div>
<div id="hud">
 <div class="topbar"><div class="brand">PRISONER <span style="color:var(--cyan)">404</span><small>THE FARADAY GHOST</small></div>
 <div class="stats"><div class="chip"><b id="score">000000</b><span id="multtxt">SCORE</span></div><div class="chip"><b id="level">01 / 06</b><span id="lvltxt">SECTOR</span></div><div class="chip"><b id="kills">0</b><span id="killtxt">TAKEDOWNS</span></div></div></div>
 <div class="bars"><div class="barlabel"><span>VITALS</span><span id="hptext">100 / 100</span></div><div class="track"><div class="fill health" id="hpbar" style="width:100%"></div></div><div class="barlabel"><span>VOLTAGE</span><span id="enText">0 / 100</span></div><div class="track"><div class="fill energy" id="enbar" style="width:0%"></div></div><div id="relicLine"></div></div>
 <div class="stageinfo"><strong id="stageTitle">THE DEEP PRISON</strong><span id="stageSub">SECTOR 404 // ESCAPE</span></div>
 <div id="toast"></div><div id="hint"></div><div id="bossbar"><div class="bossname" id="bossname">COMMANDER KAMARI</div><div class="track" style="height:10px"><div class="fill health" id="bosshp" style="width:100%"></div></div></div>
</div>
<div id="touch"><div class="pad"><button class="touchbtn move" data-key="left" aria-label="Move left">◀</button><button class="touchbtn move" data-key="right" aria-label="Move right">▶</button></div><div class="actions"><button class="touchbtn voltbtn" id="voltBtn" data-key="power">VOLT</button><button class="touchbtn big" data-key="attack">STRIKE</button><button class="touchbtn" data-key="dash">DASH</button><button class="touchbtn jumpbtn" data-key="jump">JUMP</button></div></div><div id="rotateNotice">ROTATE YOUR PHONE · LANDSCAPE RECOMMENDED</div>
<button id="pause" class="secondary" aria-label="Pause">Ⅱ</button>
<div id="dialog"><div id="dlgWho"></div><div id="dlgTxt"></div><div id="dlgHint"><span>TAP / SPACE TO CONTINUE</span><button id="dlgSkip" class="secondary">SKIP ▸▸</button></div></div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
const overlay=$('overlay'),panel=$('panel'),hud=$('hud'),touchUI=$('touch'),dlg=$('dialog');

/* ---------- story ---------- */
const LOGS=[
 'The prison was never built to hold criminals. Every cell is a capacitor. Every inmate, a battery.',
 'Subject 403 overloaded in year two. The Shogun called it a failure. The grid called it a record.',
 "Kamari carries a pardon signed in year zero. It was not issued to him. It was issued to the first Ghost.",
 'The Faraday cage exists to teach a storm it can be silenced. It failed once. It is trying again.',
 'The halo was never the Shogun\'s design. The first Ghost drew it. She called it a promise.'
];
const stages=[
 {name:'THE DEEP PRISON',sub:'SECTOR 404 // ESCAPE',intro:'Three years chained beneath the city. Hold the loop.',goal:5,enemies:['warden'],
  pre:[['ECHO','Prisoner 404. Can you hear me? Do not answer out loud. The walls listen.'],['GHOST','Three years. Every overload they fed me, I kept. I never grounded it.'],['ECHO','Then it is time to give it back. Wardens ahead. Strike, dash, and when a red ring flashes, dash THROUGH the hit. Time it right and the current answers.']],
  post:[['ECHO','Sector one is open. Below us is the vault. Your own chains are waiting.']]},
 {name:'THE CONTRABAND VAULT',sub:'FORGE YOUR CHAINS',intro:'Shields block your strikes. Land the third hit to break a guard.',goal:7,enemies:['guard','rusher','shield','bomber'],
  pre:[['GHOST','These shackles. Copper coils. They were never meant to hold me. They were meant to charge from me.'],['ECHO','Melt them into tonfas. Shield guards soak normal hits. Finish a three-hit combo, or hold STRIKE and release for a slam.']],
  post:[['ECHO','Kamari is coming. Vanguard Commander. He cut the last ghost\'s wire.']]},
 {name:'THE HIGH WIRES',sub:'VANGUARD INTERCEPT',intro:'Dodge the Shadow Cut, then punish him while he is exposed.',goal:1,boss:'kamari',
  pre:[['KAMARI','Prisoner 404. The city depends on a clean grid. You are noise.'],['GHOST','Then I will be the noise that wakes it.']],
  post:[['KAMARI','...You hold the loop. Like the first one did.'],['GHOST','The first one?'],['KAMARI','Go. Before the Shogun learns what you are.']]},
 {name:'THE FARADAY CAGE',sub:'SECTOR ZERO // NO POWER',intro:'The cage drains you. Voltage charges at half speed here. Avoid the floor panels.',goal:8,enemies:['soundlord','shield','rusher','sniper'],
  pre:[['ECHO','Faraday cage. Sector Zero. No metal, no lines. Your charge builds slowly in here.'],['GHOST','Then every strike has to count.']],
  post:[['ECHO','Baraka\'s drums echo up the Sky Elevator. Six drums. Six floors. Climb.']]},
 {name:'THE SIX DRUMS',sub:'SKY ELEVATOR // ASCENSION',intro:'Jump the shockwaves. After the sixth beat, Baraka is exposed.',goal:1,boss:'baraka',
  pre:[['BARAKA','Six drums. Six floors. Every one a heartbeat the city cannot hear.'],['GHOST','I hear it.'],['BARAKA','Then you are what they fear.']],
  post:[['BARAKA','The halo is not a crown. It is a promise. Carry it, but do not carry it alone.'],['ECHO','He is letting you pass. Raichu waits at the top.']]},
 {name:'THE THRONE OF STORMS',sub:'50,000 FT // FINAL DUEL',intro:'Three phases. In the last he takes to the sky. Watch the columns.',goal:1,boss:'shogun',
  pre:[['RAICHU','At last. Fifty thousand feet of storm, and you climbed every foot.'],['RAICHU','I built the prison to find my successor. Take the throne, Ghost.'],['GHOST','I came to end the system. Not inherit it.']],
  post:[['RAICHU','Then choose. The throne is yours either way.']]}
];
const SPEAK={ECHO:'#7df7ff',GHOST:'#ffffff',KAMARI:'#ff6c86',BARAKA:'#67efff',RAICHU:'#c9a0ff'};

/* ---------- settings / save ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DIFFS=[{n:'EASY',dmg:.7,hp:.75},{n:'NORMAL',dmg:1,hp:1},{n:'HARD',dmg:1.3,hp:1.3}];
const BS=[.85,1,1.15],BSN=['SMALL','MEDIUM','LARGE'];
let muted=store.get('p404mute','0')==='1',best=+store.get('p404best',0)||0,diff=clamp(+store.get('p404diff',1),0,2),bsize=clamp(+store.get('p404bs',1),0,2);
let endings=[];try{endings=JSON.parse(store.get('p404end','[]'))||[]}catch(e){}
const DIFF=()=>DIFFS[diff];
function applyBS(){document.documentElement.style.setProperty('--bs',BS[bsize])}applyBS();
function saveBest(){if(score>best){best=score;store.set('p404best',best)}}
function setMuted(v){muted=v;store.set('p404mute',v?'1':'0')}
function readSave(){try{const s=JSON.parse(localStorage.getItem('p404save'));return s&&typeof s.stage==='number'?s:null}catch(e){return null}}
function writeSave(nextStage){store.set('p404save',JSON.stringify({stage:nextStage,score,kills,logs:[...logs],relics,player,diff}))}

/* ---------- state ---------- */
let state='menu',stage=0,score=0,kills=0,frame=0,last=0,shake=0,flash=0,particles=[],enemies=[],projectiles=[],floaters=[],camera=0,worldW=1500,upgradeChoices=[],bossDefeated=false,bossWin=0,accumulator=0;
let keys={},touchKeys={},padKeys={},player=null,stageKills=0,spawnTimer=0,boss=null;
let hitstop=0,streak=0,mult=1,dmgTaken=0,platforms=[],hazards=[],term=null,logs=new Set(),cp={kills:0,set:false,boss:false},spawnedCount=0;

/* ---------- endless + meta progression ---------- */
let endless=false,wave=1,endCfg=null,runAwarded=0,bestWave=+store.get('p404wave',0)||0;
let meta={shards:0,lv:{vit:0,cap:0,str:0,spd:0,chg:0,mag:0},own:[0],sel:0};
try{const m=JSON.parse(store.get('p404meta','null'));if(m){meta.shards=m.shards||0;Object.assign(meta.lv,m.lv||{});meta.own=Array.isArray(m.own)?m.own:[0];meta.sel=m.sel||0}}catch(e){}
function saveMeta(){store.set('p404meta',JSON.stringify(meta))}
const COLS=[{n:'CYAN',c:'#5af1ff',cost:0},{n:'GOLD',c:'#ffd36a',cost:150},{n:'MAGENTA',c:'#ff6cf0',cost:200},{n:'LIME',c:'#9dff6a',cost:250},{n:'CRIMSON',c:'#ff526f',cost:300},{n:'VIOLET',c:'#b78bff',cost:350}];
let PC=(COLS[meta.sel]||COLS[0]).c;
const PERKS=[{k:'vit',n:'IRON VEINS',d:'+10 max health per level',max:5,base:40},{k:'cap',n:'DEEP CAPACITOR',d:'+10 max voltage per level',max:5,base:40},{k:'str',n:'RAIL FORCE',d:'+2 strike damage per level',max:5,base:50},{k:'spd',n:'STATIC STRIDE',d:'+0.15 move speed per level',max:5,base:40},{k:'chg',n:'PRIMED COIL',d:'Start each run with +10 voltage',max:3,base:60},{k:'mag',n:'SHARD MAGNET',d:'+10% shards earned per level',max:5,base:80}];
const BOSSN=['kamari','baraka','shogun'];
let srnd=()=>Math.random(),pickups=[];
let curMod=null,relics=[];
let set={shake:true,flash:true,music:true};
try{Object.assign(set,JSON.parse(store.get('p404set','{}')))}catch(e){}
const saveSet=()=>store.set('p404set',JSON.stringify(set));
let interacted=false;['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{interacted=true},{once:true}));
let tut=-1,tf={},tutX=0,tutDone=store.get('p404tut','0')==='1';
const TUT=[
 ['MOVE',()=>isTouchDevice()?'Use the left / right pad to move':'Move with A / D or arrow keys',()=>Math.abs(player.x-tutX)>140],
 ['JUMP',()=>isTouchDevice()?'Tap JUMP. Hold it to jump higher':'Press Space / W to jump. Hold for height',()=>tf.jump],
 ['STRIKE',()=>isTouchDevice()?'Tap STRIKE. Chain three hits for a finisher':'Press J to strike. Chain three hits for a finisher',()=>tf.atk],
 ['DASH',()=>isTouchDevice()?'Tap DASH. You are invulnerable while dashing':'Press K / Shift to dash. You are invulnerable',()=>tf.dash],
 ['SLAM',()=>isTouchDevice()?'Hold STRIKE, then release for a ground slam':'Hold J, then release for a ground slam',()=>tf.slam],

  const gps=navigator.getGamepads?navigator.getGamepads():[];let start=false,a=false;
  for(const g of gps){if(!g)continue;const bt=i=>g.buttons[i]&&g.buttons[i].pressed,ax=g.axes[0]||0;
   if(ax<-.4||bt(14))padKeys.left=true;if(ax>.4||bt(15))padKeys.right=true;if(bt(0))padKeys.jump=true;
   if(bt(2)||bt(5))padKeys.attack=true;if(bt(1)||bt(4))padKeys.dash=true;if(bt(3)||bt(7))padKeys.power=true;

 else if(e.type==='shield'){ctx.fillStyle='#d9a54a';ctx.fillRect(x+10,y+28,15,4)}
 else if(e.type==='sniper'){ctx.fillStyle='#c9d6ff';ctx.fillRect(f>0?x+14:x-18,y+28,38,3);ctx.fillStyle='#ff526f';ctx.fillRect(f>0?x+50:x-20,y+27,3,5)}
 else if(e.type==='bomber'){ctx.fillStyle='#8a4a1c';ctx.fillRect(f>0?x-6:x+26,y+22,14,22);ctx.fillStyle='#ffb15a';ctx.fillRect(f>0?x-4:x+28,y+26,4,4)}
 else if(e.type==='summoner'){ctx.strokeStyle='#ffd36a';ctx.lineWidth=2;ctx.shadowBlur=10;ctx.shadowColor='#ffd36a';ctx.beginPath();ctx.ellipse(x+17,y-2,15,5,0,0,7);ctx.stroke();ctx.shadowBlur=0}
 else if(e.type==='soundlord'){ctx.strokeStyle='#d9b8ff';ctx.lineWidth=2;ctx.shadowBlur=8;ctx.shadowColor='#b77bff';ctx.beginPath();ctx.arc(x+17,y+32,9+Math.sin(frame*.2)*2,0,7);ctx.stroke();ctx.shadowBlur=0}
 // helmet
 ctx.fillStyle='#1a1827';ctx.beginPath();ctx.arc(x+17,y+12,12,0,7);ctx.fill();
 ctx.fillStyle='#ff6c86';ctx.shadowBlur=10;ctx.shadowColor='#ff6c86';ctx.fillRect(x+(f>0?18:8),y+10,7,3);ctx.shadowBlur=0;
 // baton
 ctx.fillStyle='#8aa0b4';ctx.fillRect(f>0?x+30:x-8,y+30,12,4);
 if(e.aim>0){ctx.save();ctx.strokeStyle='#ff526f';ctx.globalAlpha=.25+.5*(1-e.aim/44);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+17,y+25);ctx.lineTo(x+17+e.face*700,y+25);ctx.stroke();ctx.restore()}
 if(e.elite){ctx.strokeStyle='#ffd36a';ctx.lineWidth=2;ctx.shadowBlur=16;ctx.shadowColor='#ffd36a';ctx.strokeRect(x-2,y+8,38,48);ctx.shadowBlur=0;ctx.fillStyle='#ffd36a';ctx.beginPath();ctx.moveTo(x+5,y-1);ctx.lineTo(x+9,y-9);ctx.lineTo(x+17,y-3);ctx.lineTo(x+25,y-9);ctx.lineTo(x+29,y-1);ctx.fill()}
 if(e.type==='shield'){ctx.fillStyle=e.block>0?'#ffffff':'#5fd2ffcc';ctx.shadowBlur=14;ctx.shadowColor='#5fd2ff';ctx.fillRect(f>0?x+30:x-6,y+8,7,44);ctx.shadowBlur=0}
 if(e.stun>20&&e.type==='shield'){ctx.fillStyle='#ffe28b';ctx.font='bold 14px Rajdhani,Arial';ctx.fillText('BROKEN',x-4,y-18)}
 if(e.wind>0){ctx.strokeStyle='#ff526f';ctx.lineWidth=2;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(x+17,y+30,34-e.wind,0,7);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#ff526f';ctx.font='bold 22px Rajdhani,Arial';ctx.fillText('!',x+14,y-16)}
 ctx.fillStyle='#3a1b24';ctx.fillRect(x,y-8,34,5);ctx.fillStyle='#ff7186';ctx.fillRect(x,y-8,34*Math.max(0,e.hp)/e.maxHp,5);ctx.strokeStyle='#ff7186';ctx.lineWidth=1;ctx.strokeRect(x,y-8,34,5);
 ctx.restore();
}
function drawBoss(b){
 ctx.save();const x=b.x,y=b.y,sh=b.type==='shogun',bk=b.type==='baraka';
 const col=sh?'#b77bff':bk?'#67efff':'#ff4e70';
 // boss aura
 const ag=ctx.createRadialGradient(x+31,y+45,10,x+31,y+45,110);ag.addColorStop(0,col+(b.rage?'55':'33'));ag.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=ag;ctx.fillRect(x-80,y-70,220,220);
 if(b.rage&&frame%5<2)drawBoltPts(makeBolt(x+31,y+20,x+31+rand(-80,80),y+rand(-60,100)),col,2);
 ctx.fillStyle='#02050b88';ctx.beginPath();ctx.ellipse(x+31,groundY()+2,38,8,0,0,7);ctx.fill();
 if(b.mode==='tele'){ctx.globalAlpha=.25+.25*Math.sin(frame*.7);ctx.fillStyle='#ff526f';ctx.fillRect(b.dashDir>0?x+31:x-569,groundY()-16,600,16);ctx.globalAlpha=1}
 if(b.stun>0){ctx.fillStyle='#ffe28b';ctx.font='bold 18px Rajdhani,Arial';ctx.fillText('EXPOSED',x-2,y-30);for(let k=0;k<3;k++){const a=frame*.2+k*2.1;ctx.fillRect(x+31+Math.cos(a)*26,y-8+Math.sin(a)*6,4,4)}}
 if(b.windup){ctx.globalAlpha=.35+.25*Math.sin(frame*.45);ctx.strokeStyle='#ff647d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x+31,y+45,72+Math.sin(frame*.35)*7,0,7);ctx.stroke();ctx.globalAlpha=1}
 if(b.flash>0)ctx.globalAlpha=.5;
 ctx.shadowBlur=b.rage?40:25;ctx.shadowColor=col;
 // cape
 ctx.fillStyle=sh?'#241638':'#2a1428';ctx.beginPath();ctx.moveTo(x+6,y+30);ctx.lineTo(x+56,y+30);ctx.lineTo(x+66+Math.sin(frame*.1)*5,y+92);ctx.lineTo(x-4+Math.sin(frame*.1)*5,y+92);ctx.closePath();ctx.fill();
 ctx.fillStyle=sh?'#34264e':'#391d36';ctx.fillRect(x+8,y+28,48,60);
 const bg=ctx.createLinearGradient(x,y+37,x+60,y+72);bg.addColorStop(0,sh?'#9a78d4':'#d04868');bg.addColorStop(1,sh?'#4c3478':'#7a2440');
 ctx.fillStyle=bg;ctx.fillRect(x+3,y+37,58,35);
 // shoulder spikes
 ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-6,y+40);ctx.lineTo(x+8,y+32);ctx.lineTo(x+6,y+52);ctx.fill();ctx.beginPath();ctx.moveTo(x+70,y+40);ctx.lineTo(x+56,y+32);ctx.lineTo(x+58,y+52);ctx.fill();
 // core
 ctx.fillStyle='#fff';ctx.globalAlpha=(b.flash>0?.5:1)*(.7+.3*Math.sin(frame*.15));ctx.beginPath();ctx.arc(x+31,y+54,6,0,7);ctx.fill();ctx.globalAlpha=b.flash>0?.5:1;
 // head
 ctx.fillStyle='#101a2d';ctx.beginPath();ctx.arc(x+31,y+20,25,0,7);ctx.fill();
 ctx.fillStyle=sh?'#d8b5ff':'#ff627d';ctx.fillRect(x+15,y+17,32,5);
 // crown / horns
 ctx.fillStyle=col;if(sh){for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x+11+i*10,y-2);ctx.lineTo(x+16+i*10,y-16-(i===2?8:0));ctx.lineTo(x+21+i*10,y-2);ctx.fill()}}
 else{ctx.beginPath();ctx.moveTo(x+8,y);ctx.lineTo(x+2,y-18);ctx.lineTo(x+18,y-6);ctx.fill();ctx.beginPath();ctx.moveTo(x+54,y);ctx.lineTo(x+60,y-18);ctx.lineTo(x+44,y-6);ctx.fill()}
 ctx.fillStyle='#d8efff';ctx.fillRect(x+14,y+83,14,9);ctx.fillRect(x+38,y+83,14,9);ctx.shadowBlur=0;
 if(b.type!=='kamari'){const n=sh?9:6;for(let i=0;i<n;i++){const a=frame*.025+i*Math.PI*2/n,r=58;ctx.fillStyle=col;ctx.shadowBlur=15;ctx.shadowColor=col;ctx.beginPath();ctx.arc(x+31+Math.cos(a)*r,y+35+Math.sin(a)*r*.55,6,0,7);ctx.fill()}}
 ctx.restore();
}

/* ---------- main loop ---------- */
function loop(t){
 if(!last)last=t;
 const delta=Math.min(100,t-last);last=t;
 pollPad();
 if(state==='playing'){
  accumulator+=delta;const step=1000/60;let guard=0;
  while(accumulator>=step&&guard++<6){update();latch={};accumulator-=step;if(state!=='playing')break}
 }else{accumulator=0;frame++;latch={}}
 draw();
 requestAnimationFrame(loop);
}

/* ---------- input ---------- */
const nk=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{
 const k=nk(e);
 if(state==='dialog'){if(k===' '||k==='Enter'){e.preventDefault();if(!e.repeat)advanceDialogue()}return}
 keys[k]=true;latch[k]=true;
 if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
 if((k==='Escape'||k==='p')&&!e.repeat)pauseGame();
});
addEventListener('keyup',e=>{keys[nk(e)]=false;if(e.key==='Shift')keys['Shift']=false});
addEventListener('blur',clearInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseGame()});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-key]').forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener('pointerdown',e=>{e.preventDefault();touchKeys[k]=true;latch[k]=true;b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch(err){}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{touchKeys[k]=false;b.classList.remove('active')}));
});
if(location.hash==='#debug')window.__g={loadStage,get state(){return state},get player(){return player},get boss(){return boss},get enemies(){return enemies},get logs(){return logs},startRush,startDaily,rushWin,get prof(){return prof},checkAch,stat,showCodex,get relics(){return relics},set mod(i){curMod=i<0?null:MODS[i]},get curMod(){return curMod},relicPick,upgradePanel,startEndless,spawnEnemy,get wave(){return wave},get meta(){return meta},begin,finishStage,winStage,showEnding,dealBoss,set hp(v){if(boss)boss.hp=v}};
showMenu();requestAnimationFrame(loop);
})();
